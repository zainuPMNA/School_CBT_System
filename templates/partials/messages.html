{% if messages %}
<div class="space-y-2" x-data>
  {% for message in messages %}
  <div class="alert alert-{{ message.level_tag|default:'info' }} flex items-start justify-between gap-3" x-data="{ show: true }" x-show="show">
    <span>{{ message }}</span>
    <button type="button" class="text-current opacity-60 hover:opacity-100" @click="show = false" aria-label="Dismiss">&times;</button>
  </div>
  {% endfor %}
</div>
{% endif %}
