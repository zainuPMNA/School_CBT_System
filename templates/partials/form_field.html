<div class="{{ wrapper_class|default:'' }}">
  {% if field.widget_type == "checkbox" %}
    <label class="inline-flex items-center gap-2 text-sm font-medium text-slate-700">{{ field }} {{ field.label }}</label>
  {% else %}
    <label {% if field.widget_type != "radioselect" %}for="{{ field.id_for_label }}"{% endif %} class="label">
      {{ field.label }}{% if field.field.required %} <span class="text-rose-600">*</span>{% endif %}
    </label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
</div>
