<ul class="max-h-60 space-y-1 overflow-y-auto">
  {% for v in violations %}
  <li class="flex justify-between gap-2 border-b border-slate-100 pb-1 last:border-0">
    <span class="font-medium text-rose-700">{{ v.get_violation_type_display }}</span>
    <span class="text-slate-500">{{ v.timestamp|date:"H:i:s" }}</span>
  </li>
  {% empty %}
  <li class="text-slate-500">No violations.</li>
  {% endfor %}
</ul>
