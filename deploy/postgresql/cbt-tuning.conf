# PostgreSQL 16 tuning for the CBT lab server.
# Installed to /etc/postgresql/<ver>/main/conf.d/cbt-tuning.conf by setup_server.sh.
# @...@ placeholders are replaced from the server's RAM
# (shared_buffers = 25% RAM, effective_cache_size = 70% RAM).
#
# Workload: 60-100 students saving answers every few seconds = many tiny
# single-row UPDATEs, a few reads, short transactions.

listen_addresses = 'localhost'          # app is on the same box; never expose 5432
max_connections = 100                   # Gunicorn uses ~5 procs x 6 pooled = 30

shared_buffers = @SHARED_BUFFERS@
effective_cache_size = @EFFECTIVE_CACHE@
maintenance_work_mem = @MAINT_WORK_MEM@
work_mem = 16MB

# Write path: keep synchronous_commit ON — an answer the student saw as
# "saved" must survive a power cut.
wal_buffers = 16MB
min_wal_size = 512MB
max_wal_size = 2GB
checkpoint_completion_target = 0.9

# SSD-friendly planner settings (set random_page_cost = 4 on a spinning disk)
random_page_cost = 1.1
effective_io_concurrency = 200

# Safety nets
idle_in_transaction_session_timeout = 60s
statement_timeout = 30s
lock_timeout = 10s

# Logging slow queries helps when tuning after a load test
log_min_duration_statement = 500ms
log_lock_waits = on
