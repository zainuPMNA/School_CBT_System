# /etc/nginx/sites-available/cbt  (installed by deploy/setup_server.sh)
# Serves static/media directly and proxies everything else to Gunicorn.

upstream cbt_app {
    server unix:/run/cbt/gunicorn.sock fail_timeout=0;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Bulk Excel/CSV uploads and question images (Django allows 25 MB too).
    client_max_body_size 25m;
    client_body_timeout 60s;

    # Security headers (everything is same-origin; no external resources at all).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/cbt.access.log;
    error_log  /var/log/nginx/cbt.error.log warn;

    # Collected static files (KaTeX, Alpine, HTMX, Tailwind) — hashed names, cache forever.
    location /static/ {
        alias /opt/cbt/app/staticfiles/;
        gzip_static on;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Uploaded question images.
    location /media/ {
        alias /var/lib/cbt/media/;
        expires 7d;
        access_log off;
        location ~* \.(php|py|sh|html?)$ { deny all; }
    }

    # Admin Backup page: uploaded backup files can be large and a restore can take a while.
    location ^~ /dashboard/backup/ {
        client_max_body_size 500m;
        client_body_timeout 300s;
        proxy_read_timeout 300s;
        proxy_pass http://cbt_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /favicon.ico { access_log off; log_not_found off; return 204; }

    location / {
        proxy_pass http://cbt_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 65s;
        proxy_read_timeout 65s;
        proxy_redirect off;
    }
}
